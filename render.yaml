services:
  - type: web
    name: decisionai-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: "gemini-3.5-flash-lite"
      - key: TRANSCRIPTION_PROVIDER
        value: "gemini"
      - key: CORS_ORIGINS
        value: "http://localhost:8000"
      - key: SECRET_KEY
        generateValue: true
